<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Tracker</title>
<meta name="description" content="Window covering jobs from first call to install check-in. Works offline and syncs between your devices.">
<meta name="theme-color" content="#eef1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a phone app, fixed tab bar at the bottom, sheets slide up for every form.
   Look: cool stone neutrals with a deep fabric-teal accent; the job's progress is drawn as window slats. */
:root {
  --bg: #eef1ef;
  --surface: #ffffff;
  --sunk: #e3e8e5;
  --ink: #17201d;
  --muted: #5a6762;
  --line: #d3dbd7;
  --accent: #1d6a5b;
  --accent-ink: #ffffff;
  --accent-soft: #d6e9e3;
  --warn: #a8571f;
  --warn-soft: #f6e4d6;
  --danger: #b03a32;
  --ev-sales: #4f6d8f;
  --ev-measure: #82699a;
  --ev-install: #3f8256;
  --ev-meeting: #3d8590;
  --ev-other: #8c867c;
  --ev-prewire: #a8822f;
  --ev-service: #a9524a;
  --shadow: 0 1px 2px rgba(20, 35, 30, .06), 0 6px 20px rgba(20, 35, 30, .06);
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #182019; --sunk: #121815; --ink: #e4ebe7; --muted: #95a39d; --line: #2a3430;
    --accent: #5cbfa6; --accent-ink: #08201a; --accent-soft: #1b3830; --warn: #e39a62; --warn-soft: #3a2719; --danger: #ec7a70;
    --ev-sales: #7f9fc4; --ev-measure: #b29bcb; --ev-install: #73b98a; --ev-meeting: #6fb7c1; --ev-other: #aaa498; --ev-prewire: #d1ab5b; --ev-service: #d58479;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #182019; --sunk: #121815; --ink: #e4ebe7; --muted: #95a39d; --line: #2a3430;
  --accent: #5cbfa6; --accent-ink: #08201a; --accent-soft: #1b3830; --warn: #e39a62; --warn-soft: #3a2719; --danger: #ec7a70;
  --ev-sales: #7f9fc4; --ev-measure: #b29bcb; --ev-install: #73b98a; --ev-meeting: #6fb7c1; --ev-other: #aaa498; --ev-prewire: #d1ab5b; --ev-service: #d58479;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* App-style scrolling: the page itself stays put and only the content scrolls, with no rubber-band stretch. */
html { height: 100%; overflow: hidden; overscroll-behavior: none; color-scheme: light; }
body { height: 100%; overflow-y: auto; overscroll-behavior: none; -webkit-overflow-scrolling: touch; touch-action: manipulation; }
button, a, .row, .day, .chip { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 680px; margin: 0 auto; padding-block: calc(14px + env(safe-area-inset-top, 0px)) 110px; display: flex; flex-direction: column; gap: 22px; }

/* Top status line */
.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink); letter-spacing: -.01em; }
.brand svg { width: 22px; height: 22px; }
.sync { display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.sync.saving i { background: var(--warn); }
.sync.off i { background: var(--muted); }

h1, h2, h3 { font-family: var(--font-display); letter-spacing: -.015em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 7vw, 36px); line-height: 1.08; font-weight: 700; }
h2 { font-size: 19px; font-weight: 700; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
p { margin: 0; }

.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head .count { font-size: 14px; color: var(--muted); font-weight: 500; font-family: var(--font-body); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.empty { padding: 18px; color: var(--muted); font-size: 15px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.big { min-height: 52px; font-size: 16px; padding: 0 22px; width: 100%; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 15px; cursor: pointer; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; color: var(--ink); flex: none; }
.icon-btn svg { width: 18px; height: 18px; }

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quick .btn { padding: 0 8px; font-size: 14px; }

/* Week strip */
.week { display: flex; flex-direction: column; gap: 10px; }
.week-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.week-nav strong { font-family: var(--font-display); font-size: 17px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: 12px; border: 1px solid transparent; background: none; cursor: pointer; min-width: 0; }
.day .dw { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.day .dn { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.day .dots { display: flex; gap: 3px; height: 6px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.day.today .dn { color: var(--accent); }
.day.sel { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.day.sel.today { background: var(--accent); border-color: var(--accent); }
.day.sel.today .dn, .day.sel.today .dw { color: var(--accent-ink); }

/* Agenda rows */
.row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; color: inherit; text-decoration: none; }
.row:hover { background: var(--sunk); }
.row .when { width: 52px; flex: none; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; padding-top: 1px; }
.row .when small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.row .bar { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }
.row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .s { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.row .end { flex: none; align-self: center; color: var(--muted); }
.row.done .t { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted); background: none; flex: none; display: grid; place-items: center; cursor: pointer; margin-top: 1px; color: var(--accent-ink); padding: 0; }
.check.on { background: var(--accent); border-color: var(--accent); }
.check svg { width: 14px; height: 14px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.ok { background: var(--accent-soft); color: var(--accent); }

/* Jobs list */
.search { position: relative; }
.search input { width: 100%; min-height: 48px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px 0 44px; font-size: 16px; }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.job-row .slats-mini { flex: none; align-self: center; }
.stage-group { display: flex; flex-direction: column; gap: 8px; }
.stage-group h3 { font-size: 15px; font-family: var(--font-body); font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }

/* Slats: a job's progress drawn as six window slats */
.slats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; background: none; border: 0; padding: 0; width: 100%; cursor: pointer; }
.slats span { height: 12px; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); position: relative; }
.slats span.on { background: var(--accent); border-color: var(--accent); }
.slats span.now { background: repeating-linear-gradient(-55deg, var(--accent) 0 5px, var(--accent-soft) 5px 9px); border-color: var(--accent); }
.slats-mini { display: grid; grid-template-rows: repeat(6, 3px); gap: 2px; width: 22px; }
.slats-mini i { display: block; border-radius: 1px; background: var(--line); }
.slats-mini i.on { background: var(--accent); }
.stage-labels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; font-size: 11px; color: var(--muted); text-align: center; }
.stage-labels .now { color: var(--accent); font-weight: 700; }

/* Job page */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 600; text-decoration: none; font-size: 15px; }
.back svg { width: 18px; height: 18px; }
.job-head { display: flex; flex-direction: column; gap: 8px; }
.job-head .addr { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.next { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.next .why { font-size: 14px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; padding: 14px; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.note-entry { padding: 13px 14px; display: flex; flex-direction: column; gap: 3px; }
.note-entry .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.note-entry .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.money { font-weight: 700; font-variant-numeric: tabular-nums; }
.room-head { padding: 9px 14px; font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--sunk); }
.file-thumb { width: 44px; height: 44px; border-radius: 8px; flex: none; object-fit: cover; background: var(--sunk); display: grid; place-items: center; color: var(--muted); font-size: 11px; font-weight: 700; border: 1px solid var(--line); }
.person-line { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.copy { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-size: 14px; }

.banner { padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); font-size: 15px; display: flex; flex-direction: column; gap: 8px; }
.banner.warn { background: var(--warn-soft); }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabbar nav { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; border-radius: 10px; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--accent); }

/* Sheet (all forms) */
dialog#sheet { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, 100%); max-width: 100%; max-height: 92dvh; border-radius: 20px 20px 0 0; margin: auto auto 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .2); }
@media (min-width: 640px) { dialog#sheet { border-radius: 20px; margin: auto; } }
dialog#sheet::backdrop { background: rgba(10, 18, 15, .45); }
.sheet-in { display: flex; flex-direction: column; max-height: 92dvh; }
.sheet-head { padding: 18px 20px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet-head h2 { font-size: 21px; }
.sheet-body { padding: 4px 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-foot { padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.sheet-foot .btn { flex: 1; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-size: 14px; font-weight: 600; }
.field input, .field select, .field textarea { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); padding: 10px 12px; font-size: 16px; }
.field textarea { min-height: 90px; resize: vertical; }
.field .hint { font-size: 13px; color: var(--muted); }
.fields-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.radios { display: flex; flex-wrap: wrap; gap: 6px; }
.radios input { position: absolute; opacity: 0; pointer-events: none; }
.radios label { min-height: 38px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; font-size: 14px; cursor: pointer; background: var(--bg); }
.radios input:checked + label { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.radios input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choices .btn { justify-content: flex-start; white-space: normal; text-align: left; min-height: 50px; border-radius: 12px; }
.choices .btn small { display: block; color: var(--muted); font-weight: 500; }
.sheet-context { color: var(--muted); font-size: 15px; }

#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.progress { height: 6px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<div id="app" aria-live="polite"></div>
<div class="tabbar"><nav aria-label="Main">

  <a href="#jobs" data-tab="jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="17" rx="2.5"/><path d="M3 8h18M3 12.5h18M3 17h18"/></svg>Jobs</a>
  <a href="#more" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>More</a>
</nav></div>
<dialog id="sheet"></dialog>
<div id="toast" role="status"></div>

<script src="supabase.js"></script>
<script>
(function () {
'use strict';

// ---------- Constants ----------
const STAGES = [
  { id: 'lead', label: 'New lead', short: 'Lead', sec: 'sales' },
  { id: 'consult', label: 'Sales calls', short: 'Sales', sec: 'sales' },
  { id: 'quoted', label: 'Quotes out', short: 'Quotes', sec: 'sales' },
  { id: 'measure', label: 'Final measure', short: 'Measure', sec: 'install' },
  { id: 'ordered', label: 'Ordered', short: 'Ordered', sec: 'install' },
  { id: 'install', label: 'Install', short: 'Install', sec: 'install' },
  { id: 'complete', label: 'Done', short: 'Done', sec: 'closed' },
  { id: 'lost', label: 'Lost', short: 'Lost', sec: 'closed' },
];
const OLD_STAGES = { quoting: 'consult', proposal: 'quoted', sold: 'measure', prewire: 'measure', waiting: 'measure', punch: 'install' };
const STEP_IDS = STAGES.slice(0, 6).map((s) => s.id);
const stage = (id) => STAGES.find((s) => s.id === id) || STAGES[0];
const stageIdx = (id) => (id === 'complete' ? 6 : STEP_IDS.indexOf(id));

const EVENT_TYPES = [
  { id: 'sales', label: 'Sales call', pick: true },
  { id: 'measure', label: 'Final measure', pick: true },
  { id: 'install', label: 'Install', pick: true },
  { id: 'meeting', label: 'Site visit', pick: true },
  { id: 'other', label: 'Other', pick: true },
  { id: 'prewire', label: 'Pre-wire / drill' },
  { id: 'service', label: 'Service / repair' },
];
const evType = (id) => EVENT_TYPES.find((t) => t.id === id) || EVENT_TYPES[4];
const evColor = (id) => `var(--ev-${evType(id).id})`;
// Booking one of these moves the job forward to that step.
const EVENT_STAGE = { sales: 'consult', measure: 'measure', install: 'install' };

const NOTE_TYPES = ['Note', 'Call', 'Text', 'Email', 'Visit'];
const ROLES = ['Homeowner', 'Interior Designer', 'Builder / GC', 'Contractor', 'Architect', 'Electrician', 'Low-voltage / AV', 'Property Manager', 'Vendor / Rep', 'Other'];
const SOURCES = ['Referral', 'Interior designer', 'Builder / contractor', 'Website', 'Showroom', 'Repeat customer', 'Home show', 'Phone call', 'Other'];
const CATEGORIES = ['Shades', 'Blinds', 'Shutters', 'Drapery', 'Outdoor Screens & Shades', 'Motorization / Controls', 'Hardware / Other'];
const BRANDS = ['Hunter Douglas', 'Lutron', 'Norman', 'Graber', 'Levolor', 'Alta', 'Lafayette', 'Draper', 'MechoShade', 'Bali', 'Sunburst', 'Polywood', 'Kirsch', 'Phantom Screens', 'Insolroll', 'Somfy', 'Hunter Douglas PowerView', 'Control4', 'Savant', 'Custom Workroom'];
const MOUNTS = ['Inside', 'Outside', 'Ceiling', 'Wall', 'Pocket'];
const CONTROLS = ['Cordless', 'Cord', 'Wand', 'Chain / loop', 'Motorized – hardwired', 'Motorized – battery', 'Motorized – plug-in', 'Manual crank'];
const ITEM_STATUSES = ['Quoted', 'Ordered', 'Received', 'Installed', 'Issue'];

const nowISO = () => new Date().toISOString();
const clone = (o) => JSON.parse(JSON.stringify(o ?? null));
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return ymd(d); };
const dayDiff = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 86400000);
const fmtDay = (s, o = { weekday: 'short', month: 'short', day: 'numeric' }) => (s ? parseDay(s).toLocaleDateString(undefined, o) : '');
const relDay = (s) => {
  if (!s) return '';
  const n = dayDiff(today(), s);
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n === -1) return 'Yesterday';
  if (n > 1 && n < 7) return parseDay(s).toLocaleDateString(undefined, { weekday: 'long' });
  return fmtDay(s, { month: 'short', day: 'numeric', year: parseDay(s).getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
};
const fmtTime = (t) => {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'pm' : 'am';
  const hh = h % 12 || 12;
  return m ? `${hh}:${pad(m)}${ap}` : `${hh}${ap}`;
};
const money = (n) => (n === '' || n == null || isNaN(Number(n)) ? '' : Number(n).toLocaleString(undefined, { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }));
const firstName = (name) => String(name || '').split(/[\s&]/)[0] || '';
const fmtSize = (b) => (b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB');

// Tiny IndexedDB helper: 'kv' holds saved data, 'blobs' holds files kept on this device.
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('job-tracker', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('blobs'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = (store, mode, fn) => open().then((db) => new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const q = fn(t.objectStore(store));
    t.oncomplete = () => res(q && q.result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  }));
  return { get: (s, k) => tx(s, 'readonly', (o) => o.get(k)), set: (s, k, v) => tx(s, 'readwrite', (o) => o.put(v, k)), del: (s, k) => tx(s, 'readwrite', (o) => o.delete(k)) };
})();

let outbox = {};
let lastPull = '';
let outV = 0;
let persistT = 0;
function persistNow() {
  clearTimeout(persistT);
  if (!S.user) return Promise.resolve();
  return idb.set('kv', 'state:' + S.user.id, { jobs: all('jobs'), events: all('events'), tasks: all('tasks'), meta: S.meta, outbox, lastPull })
    .catch((e) => { console.error(e); toast('Couldn’t save on this device. It may be out of space.'); });
}
function persist() { clearTimeout(persistT); persistT = setTimeout(persistNow, 200); }
document.addEventListener('visibilitychange', () => { if (document.hidden) persistNow(); else syncSoon(50); });

function enqueue(coll, id, body) {
  outbox[coll + '/' + id] = { coll, id, body, v: `${++outV}:${Date.now()}`, at: Date.now() };
  persist();
  syncSoon();
}
function put(coll, obj) {
  if (!obj.id) obj.id = uid();
  if (!obj.createdAt) obj.createdAt = nowISO();
  obj.updatedAt = nowISO();
  const body = clone(obj);
  S[coll].set(obj.id, body);
  schedule();
  enqueue(coll, obj.id, body);
  return obj;
}
function del(coll, id) {
  S[coll].delete(id);
  schedule();
  enqueue(coll, id, null);
}
const get = (coll, id) => clone(S[coll].get(id));
const all = (coll) => [...S[coll].values()];

let syncing = false, syncAgain = false;
function syncSoon(ms = 400) { clearTimeout(syncSoon.t); syncSoon.t = setTimeout(sync, ms); }
async function sync() {
  if (!S.sb || !S.user || S.mode !== 'live' || !navigator.onLine) { schedule(); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  try {
    await uploadPendingFiles();
    const items = Object.values(outbox);
    for (let i = 0; i < items.length; i += 200) {
      const chunk = items.slice(i, i + 200);
      const { error } = await S.sb.from('docs').upsert(chunk.map((it) => ({ user_id: S.user.id, coll: it.coll, id: it.id, body: it.body || {}, deleted: !it.body })), { onConflict: 'user_id,coll,id' });
      if (error) throw error;
      chunk.forEach((it) => { const k = it.coll + '/' + it.id; if (outbox[k] && outbox[k].v === it.v) delete outbox[k]; });
      persist();
    }
    await pull();
    S.syncError = '';
  } catch (e) {
    console.error(e);
    S.syncError = (e && (e.message || e.error_description)) || 'Unknown problem';
    if (/JWT|token|auth/i.test(S.syncError)) { const { data } = await S.sb.auth.getSession().catch(() => ({ data: {} })); if (!data || !data.session) { S.mode = 'signin'; S.msg = 'Please sign in again.'; } }
  } finally {
    syncing = false;
    schedule();
    if (syncAgain) { syncAgain = false; syncSoon(); }
  }
}
async function pull() {
  for (;;) {
    let q = S.sb.from('docs').select('coll,id,body,deleted,updated_at').order('updated_at', { ascending: true }).limit(1000);
    if (lastPull) q = q.gt('updated_at', lastPull);
    const { data, error } = await q;
    if (error) throw error;
    data.forEach(applyRemote);
    if (data.length) lastPull = data[data.length - 1].updated_at;
    if (data.length < 1000) break;
  }
  S.loaded = true;
  S.lastSync = nowISO();
  persist();
}
function applyRemote(r) {
  if (!r || !r.coll) return;
  if (outbox[r.coll + '/' + r.id]) return; // a change made here that hasn't been sent yet wins
  if (r.coll === 'meta') {
    if (r.id === 'contacts') S.meta.contacts = (r.body || {}).list || [];
    if (r.id === 'info') S.meta.lastBackup = (r.body || {}).lastBackup || '';
  } else if (S[r.coll] instanceof Map) {
    if (r.deleted) S[r.coll].delete(r.id); else S[r.coll].set(r.id, { ...r.body, id: r.id });
  }
  schedule();
}
window.addEventListener('online', () => { schedule(); syncSoon(50); });
window.addEventListener('offline', () => schedule());
setInterval(() => syncSoon(0), 30000);

// ----- Files: kept on this device right away, uploaded when there's a connection -----
const urlCache = new Map();
async function uploadPendingFiles() {
  for (const j of all('jobs')) {
    for (const f of j.files || []) {
      if (!f.pending) continue;
      const blob = await idb.get('blobs', f.id).catch(() => null);
      if (!blob) continue; // added on another device; that device uploads it
      const path = `${S.user.id}/${f.id}-${(f.name || 'file').replace(/[^\w.\-]+/g, '_')}`;
      const { error } = await S.sb.storage.from('files').upload(path, blob, { upsert: true, contentType: f.type || blob.type || undefined });
      if (error) throw error;
      const jj = get('jobs', j.id);
      const ff = jj && (jj.files || []).find((x) => x.id === f.id);
      if (ff) { ff.pending = false; ff.path = path; put('jobs', jj); }
    }
  }
}
async function fileUrl(f) {
  if (urlCache.has(f.id)) return urlCache.get(f.id);
  let u = '';
  if (f.path && S.sb && navigator.onLine) {
    const { data } = await S.sb.storage.from('files').createSignedUrl(f.path, 6 * 3600).catch(() => ({}));
    u = (data && data.signedUrl) || '';
  }
  if (!u) { const blob = await idb.get('blobs', f.id).catch(() => null); if (blob) u = URL.createObjectURL(blob); }
  if (u) urlCache.set(f.id, u);
  return u;
}
function hydrateFiles() {
  if (V.route !== 'job') return;
  const j = S.jobs.get(V.jobId);
  if (!j) return;
  (j.files || []).forEach((f) => {
    const img = document.querySelector(`[data-file-img="${f.id}"]`);
    const link = document.querySelector(`[data-file-link="${f.id}"]`);
    if (!img && !link) return;
    fileUrl(f).then((u) => {
      if (!u) return;
      const i2 = document.querySelector(`[data-file-img="${f.id}"]`);
      const l2 = document.querySelector(`[data-file-link="${f.id}"]`);
      if (i2) i2.src = u;
      if (l2) { l2.href = u; l2.hidden = false; }
    });
  });
}

function setStage(job, to) {
  if (job.stage === to) return;
  job.stage = to;
  job.stageHistory = job.stageHistory || [];
  job.stageHistory.push({ stage: to, at: nowISO() });
  // Reminders the app made for an earlier step are finished once the job moves on.
  all('tasks').forEach((t) => {
    if (t.jobId === job.id && !t.done && t.forStage && t.forStage !== to) put('tasks', { ...clone(t), done: true, doneAt: nowISO() });
  });
  const auto = AUTO_TASKS[to];
  if (auto) put('tasks', { title: auto.title, due: addDays(today(), auto.days), jobId: job.id, done: false, auto: true, forStage: to });
  put('jobs', job);
}
const jobEvents = (id) => all('events').filter((e) => e.jobId === id);
const jobTasks = (id) => all('tasks').filter((t) => t.jobId === id);
const evEnd = (e) => addDays(e.date, Math.max(1, Number(e.days) || 1) - 1);
const isActive = (j) => stage(j.stage).sec !== 'closed';
const client = (j) => (j.people || [])[0];

// The next thing that will happen on a job: an upcoming appointment or an open reminder.
function nextThing(j) {
  const t = today();
  const ev = jobEvents(j.id).filter((e) => evEnd(e) >= t && !e.done).sort((a, b) => (a.date + (a.start || '')).localeCompare(b.date + (b.start || '')))[0];
  const tk = jobTasks(j.id).filter((x) => !x.done).sort((a, b) => (a.due || '').localeCompare(b.due || ''))[0];
  if (tk && (!ev || tk.due <= ev.date)) return { kind: 'task', due: tk.due, text: tk.title, late: tk.due < t };
  if (ev) return { kind: 'event', due: ev.date, text: `${evType(ev.type).label}${ev.start ? ' ' + fmtTime(ev.start) : ''}`, late: false };
  return null;
}

  const app = $('#app');

  const y = document.body.scrollTop;
  const head = `<div class="topline"><span class="brand">${ICON.logo}Job Tracker</span><span id="sync" class="sync off"><i></i></span></div>`;

}

// ----- Today -----
function dayItems(day) {
  const evs = all('events').filter((e) => e.date <= day && evEnd(e) >= day).sort((a, b) => (a.start || '99').localeCompare(b.start || '99'));
  const tks = all('tasks').filter((t) => t.due === day).sort((a, b) => (a.done - b.done) || (a.time || '99').localeCompare(b.time || '99'));
  return { evs, tks };
}

function evRow(e, day) {
  const j = e.jobId && S.jobs.get(e.jobId);
  const n = Number(e.days) || 1;
  const dayNo = day ? dayDiff(e.date, day) + 1 : 0;
  const when = e.start ? fmtTime(e.start) : 'All day';
  const sub = [j ? j.name : '', n > 1 && day ? `Day ${dayNo} of ${n}` : '', e.location && (!j || e.location !== j.address) ? e.location : ''].filter(Boolean).join(' · ');
  return `<button class="row${e.done ? ' done' : ''}" data-act="event" data-id="${e.id}">
    <span class="when">${esc(when)}${e.end ? `<small>to ${esc(fmtTime(e.end))}</small>` : ''}</span>
    <span class="bar" style="background:${evColor(e.type)}"></span>
    <span class="body"><span class="t">${esc(j ? evType(e.type).label : e.title || evType(e.type).label)}</span>${sub ? `<span class="s">${esc(sub)}</span>` : ''}</span>
  </button>`;
}
function taskRow(t, showDue, hideJob) {
  const j = !hideJob && t.jobId && S.jobs.get(t.jobId);
  const late = !t.done && t.due && t.due < today();
  const sub = [showDue ? (late ? `Due ${relDay(t.due)}` : relDay(t.due)) : '', t.time ? fmtTime(t.time) : '', j ? j.name : ''].filter(Boolean).join(' · ');
  return `<div class="row${t.done ? ' done' : ''}" data-act="task" data-id="${t.id}" role="button" tabindex="0">
    <button class="check${t.done ? ' on' : ''}" data-act="tick" data-id="${t.id}" aria-label="${t.done ? 'Mark not done' : 'Mark done'}">${t.done ? ICON.check : ''}</button>

  </div>`;
}

function viewToday() {
  const t = today();
  if (!V.weekStart) V.weekStart = addDays(t, -parseDay(t).getDay());
  const days = Array.from({ length: 14 }, (_, i) => addDays(V.weekStart, i));
  const ws = parseDay(days[0]), we = parseDay(days[13]);
  const range = ws.getMonth() === we.getMonth()
    ? `${ws.toLocaleDateString(undefined, { month: 'long' })} ${ws.getDate()}–${we.getDate()}`
    : `${fmtDay(days[0], { month: 'short', day: 'numeric' })} – ${fmtDay(days[13], { month: 'short', day: 'numeric' })}`;
  const cell = (d) => {
    const { evs, tks } = dayItems(d);
    const dots = evs.slice(0, 3).map((e) => `<i style="background:${evColor(e.type)}"></i>`).join('') + (tks.some((x) => !x.done) ? '<i style="background:var(--muted)"></i>' : '');
    const dt = parseDay(d);
    return `<button class="day${d === t ? ' today' : ''}${d === V.sel ? ' sel' : ''}" data-act="pick-day" data-day="${d}" aria-label="${esc(fmtDay(d, { weekday: 'long', month: 'long', day: 'numeric' }))}">
      ${d < days[7] ? `<span class="dw">${dt.toLocaleDateString(undefined, { weekday: 'narrow' })}</span>` : ''}<span class="dn">${dt.getDate()}</span><span class="dots">${dots}</span></button>`;
  };
  const strip = days.map(cell).join('');

  // What needs attention
  const overdue = all('tasks').filter((x) => !x.done && x.due && x.due < t).sort((a, b) => a.due.localeCompare(b.due));
  const unnoted = all('events').filter((e) => !e.done && evEnd(e) < t && e.jobId && S.jobs.has(e.jobId)).sort((a, b) => b.date.localeCompare(a.date));
  const stuck = all('jobs').filter((j) => isActive(j) && !nextThing(j));
  let needs = '';
  if (overdue.length || unnoted.length || stuck.length) {
    needs = `<section class="section"><div class="section-head"><h2>Needs you</h2><span class="count">${overdue.length + unnoted.length + stuck.length}</span></div><div class="list">
      ${unnoted.map((e) => `<button class="row" data-act="how" data-id="${e.id}"><span class="bar" style="background:${evColor(e.type)}"></span><span class="body"><span class="t">How did the ${esc(evType(e.type).label.toLowerCase())} go?</span><span class="s">${esc(S.jobs.get(e.jobId).name)} · ${esc(relDay(e.date))}</span></span><span class="end">${ICON.chev}</span></button>`).join('')}
      ${overdue.map((x) => taskRow(x, true)).join('')}
      ${stuck.slice(0, 4).map((j) => `<a class="row" href="#job-${j.id}"><span class="bar" style="background:var(--warn)"></span><span class="body"><span class="t">${esc(j.name)}</span><span class="s"><span class="tag warn">No next step</span> ${esc(stage(j.stage).label)}</span></span><span class="end">${ICON.chev}</span></a>`).join('')}
      ${stuck.length > 4 ? `<a class="row" href="#jobs"><span class="body"><span class="s">${stuck.length - 4} more jobs with no next step</span></span><span class="end">${ICON.chev}</span></a>` : ''}
    </div></section>`;
  }

  const { evs, tks } = dayItems(V.sel);
  const selLabel = V.sel === t ? 'Today' : relDay(V.sel);
  const dayList = evs.length || tks.length
    ? `<div class="list">${evs.map((e) => evRow(e, V.sel)).join('')}${tks.map((x) => taskRow(x, false)).join('')}</div>`
    : `<div class="empty">Nothing on ${V.sel === t ? 'today' : esc(fmtDay(V.sel, { weekday: 'long', month: 'long', day: 'numeric' }))}.</div>`;

  let ahead = '';
  if (V.sel === t) {
    const groups = [];
    for (let i = 1; i <= 14; i++) {
      const d = addDays(t, i);
      const it = dayItems(d);
      const evStart = it.evs.filter((e) => e.date === d);
      const tOpen = it.tks.filter((x) => !x.done);
      if (evStart.length || tOpen.length) groups.push(`<div class="room-head">${esc(i < 7 ? relDay(d) : parseDay(d).toLocaleDateString(undefined, { weekday: 'long' }))} · ${esc(fmtDay(d, { month: 'short', day: 'numeric' }))}</div>${evStart.map((e) => evRow(e, d)).join('')}${tOpen.map((x) => taskRow(x, false)).join('')}`);
    }
    ahead = `<section class="section"><div class="section-head"><h2>Next 2 weeks</h2></div>${groups.length ? `<div class="list">${groups.join('')}</div>` : '<div class="empty">Nothing booked for the next two weeks.</div>'}</section>`;
  }

  const firstRun = S.loaded && !S.jobs.size
    ? `<div class="banner"><strong>Start here</strong><span>Add your first job, or bring in everything from the old app.</span><div class="btn-row"><button class="btn primary sm" data-act="new-job">${ICON.plus}New job</button><a class="btn sm" href="#more">Bring in old data</a></div></div>` : '';

  return `${loadingNote()}${firstRun}
  <header><p class="eyebrow">${esc(parseDay(t).toLocaleDateString(undefined, { weekday: 'long' }))}</p><h1>${esc(fmtDay(t, { month: 'long', day: 'numeric' }))}</h1></header>
  <div class="quick">
    <button class="btn primary" data-act="new-job">${ICON.plus}Job</button>
    <button class="btn" data-act="new-event">${ICON.plus}Appointment</button>
    <button class="btn" data-act="new-task">${ICON.plus}Reminder</button>
  </div>
  ${needs}
  <section class="week">
    <div class="week-nav"><button class="icon-btn" data-act="week" data-n="-7" aria-label="Previous week">${ICON.prev}</button><strong>${esc(range)}</strong><button class="icon-btn" data-act="week" data-n="7" aria-label="Next week">${ICON.next}</button></div>
    <div class="days">${strip}</div>
  </section>
  <section class="section"><div class="section-head"><h2>${esc(selLabel)}</h2>${V.sel !== t ? `<button class="link-btn" data-act="go-today">Back to today</button>` : ''}</div>${dayList}</section>
  ${ahead}`;
}

// ----- Jobs list -----
function slatsMini(j) {
  const n = stageIdx(j.stage);
  return `<span class="slats-mini" aria-hidden="true">${STEP_IDS.map((_, i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
}
function jobRow(j) {
  const nt = isActive(j) ? nextThing(j) : null;
  const c = client(j);
  const sub = [c && c.name !== j.name ? c.name : '', j.address].filter(Boolean).join(' · ');
  const next = !isActive(j) ? `<span class="tag">${esc(stage(j.stage).label)}</span>`
    : nt ? `<span class="tag ${nt.late ? 'warn' : 'ok'}">${esc(relDay(nt.due))}</span> ${esc(nt.text)}`
    : `<span class="tag warn">No next step</span>`;
  return `<a class="row job-row" href="#job-${j.id}">${slatsMini(j)}<span class="body"><span class="t">${esc(j.name)}</span>${sub ? `<span class="s">${esc(sub)}</span>` : ''}<span class="s">${next}</span></span><span class="end">${ICON.chev}</span></a>`;
}
function searchText(j) {
  return [j.name, j.address, j.about, j.referredBy, j.source,
    ...(j.people || []).flatMap((p) => [p.name, p.company, p.phone, p.email, p.role]),
    ...(j.log || []).map((l) => l.text), ...(j.quotes || []).map((q) => q.name + ' ' + (q.note || '')),
    ...(j.items || []).flatMap((i) => [i.room, i.brand, i.product, i.color]), ...(j.files || []).map((f) => f.name)].join(' ').toLowerCase();
}
function viewJobs() {
  const jobs = all('jobs');
  const q = V.q.trim().toLowerCase();
  const counts = { active: jobs.filter(isActive).length, complete: jobs.filter((j) => j.stage === 'complete').length, lost: jobs.filter((j) => j.stage === 'lost').length };
  let list = '';
  if (q) {
    const hits = jobs.filter((j) => searchText(j).includes(q)).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
    const people = (S.meta.contacts || []).filter((c) => [c.name, c.company, c.phone, c.email, c.role].join(' ').toLowerCase().includes(q)).slice(0, 20);
    list = (hits.length ? `<div class="list">${hits.map(jobRow).join('')}</div>` : `<div class="empty">No jobs match “${esc(V.q)}”.</div>`)
      + (people.length ? `<section class="section"><h2>Contacts</h2><div class="list">${people.map(contactRow).join('')}</div></section>` : '');
  } else if (V.filter === 'active') {
    const groups = STAGES.slice(0, 6).map((s) => {
      const js = jobs.filter((j) => j.stage === s.id).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
      return js.length ? `<div class="stage-group"><h3><span>${esc(s.label)}</span><span>${js.length}</span></h3><div class="list">${js.map(jobRow).join('')}</div></div>` : '';
    }).join('');
    list = groups || `<div class="empty">No active jobs. Tap <strong>New job</strong> to add one.</div>`;
  } else {
    const js = jobs.filter((j) => j.stage === V.filter).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
    list = js.length ? `<div class="list">${js.map(jobRow).join('')}</div>` : `<div class="empty">Nothing here yet.</div>`;
  }
  const chip = (id, label) => `<button class="chip" data-act="filter" data-f="${id}" aria-pressed="${V.filter === id && !q}">${label} <span class="muted num">${counts[id]}</span></button>`;
  return `${loadingNote()}
  <header class="section-head"><h1>Jobs</h1><button class="btn primary sm" data-act="new-job">${ICON.plus}New job</button></header>
  <div class="search">${ICON.search}<input id="q" type="search" placeholder="Search names, addresses, notes, products" value="${esc(V.q)}" autocomplete="off" aria-label="Search jobs"></div>
  <div class="chips">${chip('active', 'Active')}${chip('complete', 'Done')}${chip('lost', 'Lost')}</div>
  <div class="section" id="job-list">${list}</div>`;
}
function contactRow(c) {
  return `<div class="note-entry"><strong>${esc(c.name)}</strong><span class="person-line">${[c.role, c.company].filter(Boolean).map(esc).join(' · ')}</span>

  <section class="section"><div class="section-head"><h2>Details</h2><button class="link-btn" data-act="edit-job">Edit</button></div>

      ${j.referredBy ? `<dt>Referred by</dt><dd>${esc(j.referredBy)}</dd>` : ''}
      ${j.value ? `<dt>Est. value</dt><dd class="num">${esc(money(j.value))}</dd>` : ''}
      ${j.about ? `<dt>About</dt><dd style="white-space:pre-wrap">${esc(j.about)}</dd>` : ''}
      <dt>Added</dt><dd>${esc(fmtDay((j.createdAt || nowISO()).slice(0, 10), { month: 'short', day: 'numeric', year: 'numeric' }))}</dd>

function fileRow(f) {

  return `<div class="row" style="cursor:default">${thumb}<span class="body"><span class="t">${esc(f.name)}</span><span class="s">${[f.label, f.size ? fmtSize(f.size) : '', f.note, f.pending ? 'Waiting to upload' : '', f.missing ? 'Not brought over from the old app' : ''].filter(Boolean).map(esc).join(' · ')}</span></span><a class="btn sm" data-file-link="${f.id}" target="_blank" rel="noopener" hidden>Open</a><button class="icon-btn" data-act="file-menu" data-id="${f.id}" aria-label="File options">${ICON.dots}</button></div>`;
}

// ----- Calendar feed for Apple Calendar -----
function feedUrl(token, scheme) { const host = new URL(config().url).host; return `${scheme}://${host}/functions/v1/calendar?token=${token}`; }
function calendarCard() {
  if (!S.cal && S.sb && navigator.onLine) { S.cal = { loading: true }; loadCalendarLink(); }
  const c = S.cal || {};
  if (!navigator.onLine && !c.token) return '<p class="small muted">Connect to the internet to set this up.</p>';
  if (c.loading) return '<p class="small muted">Checking…</p>';
  if (c.error) return `<p class="small muted">${/calendar_feeds|schema cache|does not exist/i.test(c.error) ? 'One more setup step is needed in Supabase first (the calendar code).' : 'Couldn’t check right now: ' + esc(c.error)}</p><button class="btn sm" data-act="cal-retry">Try again</button>`;
  if (!c.token) return '<button class="btn primary big" data-act="cal-make">Set up my calendar link</button>';
  return `<a class="btn primary big" href="${esc(feedUrl(c.token, 'webcal'))}">Subscribe on this device</a>
    <p class="small muted">If tapping that does nothing: copy the link, then on the iPhone go to Settings → Apps → Calendar → Calendar Accounts → Add Account → Other → Add Subscribed Calendar, and paste it.</p>
    <div class="btn-row"><button class="btn sm" data-act="copy" data-v="${esc(feedUrl(c.token, 'https'))}">Copy link</button><button class="btn sm" data-act="cal-new">Make a new link</button></div>`;
}
async function loadCalendarLink() {
  const { data, error } = await S.sb.from('calendar_feeds').select('token').order('created_at', { ascending: false }).limit(1).then((r) => r, (e) => ({ error: e }));
  S.cal = error ? { error: error.message || String(error) } : { token: (data && data[0] && data[0].token) || '' };
  schedule();
}
async function makeCalendarLink(replace) {
  if (!navigator.onLine) { toast('Connect to the internet first.'); return; }
  if (replace && !(await ask('Make a new link?', 'The old link stops working. Any device subscribed to it will need to subscribe again.', 'Make new link'))) return;
  const bytes = crypto.getRandomValues(new Uint8Array(24));
  const token = [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');
  if (replace) await S.sb.from('calendar_feeds').delete().neq('token', '');
  const { error } = await S.sb.from('calendar_feeds').insert({ token, user_id: S.user.id });
  if (error) { S.cal = { error: error.message }; schedule(); return; }
  S.cal = { token };
  schedule();
  toast('Calendar link ready');
}

// ---------- Sheets (forms, choices, confirmations) ----------
const sheetEl = $('#sheet');
let sheetDone = null;
function closeSheet(v) { const f = sheetDone; sheetDone = null; if (sheetEl.open) sheetEl.close(); if (f) f(v); }
sheetEl.addEventListener('close', () => { if (sheetDone && !sheetEl.open) closeSheet(null); });
sheetEl.addEventListener('click', (e) => { if (e.target === sheetEl) closeSheet(null); });

function fieldHtml(f, v) {
  const id = 'f-' + f.name;
  const val = v ?? f.value ?? '';
  const lbl = `<label for="${id}">${esc(f.label)}</label>`;
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  if (f.type === 'textarea') return `<div class="field">${lbl}<textarea id="${id}" name="${f.name}" rows="${f.rows || 3}" placeholder="${esc(f.placeholder || '')}">${esc(val)}</textarea>${hint}</div>`;
  if (f.type === 'select') return `<div class="field">${lbl}<select id="${id}" name="${f.name}">${f.options.map((o) => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}"${String(ov) === String(val) ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>${hint}</div>`;
  if (f.type === 'radios') return `<div class="field"><span class="lbl">${esc(f.label)}</span><div class="radios" role="radiogroup">${f.options.map((o, i) => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<input type="radio" id="${id}-${i}" name="${f.name}" value="${esc(ov)}"${String(ov) === String(val) ? ' checked' : ''}><label for="${id}-${i}">${esc(ol)}</label>`; }).join('')}</div>${hint}</div>`;
  if (f.type === 'file') return `<div class="field">${lbl}<input id="${id}" name="${f.name}" type="file" accept="${esc(f.accept || '')}">${hint}</div>`;
  const list = f.list ? ` list="${id}-list"` : '';
  const dl = f.list ? `<datalist id="${id}-list">${f.list.map((o) => `<option value="${esc(o)}">`).join('')}</datalist>` : '';
  return `<div class="field">${lbl}<input id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}"${f.required ? ' required' : ''}${f.type === 'number' ? ' inputmode="decimal" step="any"' : ''}${list} autocomplete="off">${dl}${hint}</div>`;
}

// Opens a form in the sheet. Resolves with the values, or null if closed.
function form({ title, intro = '', fields = [], values = {}, submit = 'Save', extra = [] }) {
  if (sheetDone) closeSheet(null);
  const rows = fields.map((f) => (Array.isArray(f) ? `<div class="fields-2">${f.map((x) => fieldHtml(x, values[x.name])).join('')}</div>` : fieldHtml(f, values[f.name]))).join('');
  sheetEl.innerHTML = `<form class="sheet-in" novalidate>
    <div class="sheet-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="sheet-body">${intro}${rows}</div>
    <div class="sheet-foot">${extra.map(([k, l, cls]) => `<button type="button" class="btn ${cls || ''}" data-extra="${k}">${esc(l)}</button>`).join('')}${submit ? `<button type="submit" class="btn primary">${esc(submit)}</button>` : ''}</div>
  </form>`;
  return new Promise((resolve) => {
    sheetDone = resolve;
    const fm = $('form', sheetEl);
    fm.addEventListener('submit', (e) => {
      e.preventDefault();
      const req = [...fm.querySelectorAll('[required]')].find((el) => !el.value.trim());
      if (req) { req.focus(); toast('Please fill in ' + (fm.querySelector(`label[for="${req.id}"]`)?.textContent || 'the required field').toLowerCase()); return; }
      const out = {};
      fields.flat().forEach((f) => {
        if (f.type === 'file') out[f.name] = fm.elements[f.name].files[0] || null;
        else if (f.type === 'radios') out[f.name] = (fm.querySelector(`[name="${f.name}"]:checked`) || {}).value ?? '';
        else out[f.name] = (fm.elements[f.name].value || '').trim();
      });
      closeSheet(out);
    });
    $('[data-close]', sheetEl).addEventListener('click', () => closeSheet(null));
    sheetEl.querySelectorAll('[data-extra]').forEach((b) => b.addEventListener('click', () => closeSheet({ _extra: b.dataset.extra })));
    sheetEl.showModal();
    const first = fm.querySelector('input:not([type=radio]):not([type=file]), textarea');
    if (first && !first.value && matchMedia('(pointer:fine)').matches) first.focus();
  });
}
const ask = (title, text, ok = 'OK', danger = false) => form({ title, intro: `<p class="sheet-context">${text}</p>`, submit: '', extra: [['no', 'Cancel'], ['yes', ok, danger ? 'danger' : 'primary']] }).then((r) => r && r._extra === 'yes');
const choose = (title, options, intro = '') => {
  if (sheetDone) closeSheet(null);
  sheetEl.innerHTML = `<div class="sheet-in"><div class="sheet-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="sheet-body">${intro}<div class="choices">${options.map((o, i) => `<button class="btn ${o.cls || ''}" data-i="${i}"><span>${esc(o.label)}${o.hint ? `<small>${esc(o.hint)}</small>` : ''}</span></button>`).join('')}</div></div></div>`;
  return new Promise((resolve) => {
    sheetDone = resolve;
    $('[data-close]', sheetEl).addEventListener('click', () => closeSheet(null));
    sheetEl.querySelectorAll('[data-i]').forEach((b) => b.addEventListener('click', () => closeSheet(options[b.dataset.i].value)));
    sheetEl.showModal();
  });
};

async function howItWent(e) {
  const j = e.jobId && get('jobs', e.jobId);
  const NEXT_OPTS = {
    sales: [['quotes', 'Put quotes together'], ['again', 'Meet again'], ['yes', 'They said yes'], ['lost', 'Not interested']],
    measure: [['order', 'Ready to order'], ['again', 'Need to come back']],
    install: [['done', 'Job finished'], ['again', 'Need another day']],
  }[e.type] || [];
  const d = await form({
    title: `How did the ${evType(e.type).label.toLowerCase()} go?`,
    intro: `<p class="sheet-context">${j ? esc(j.name) + ' · ' : ''}${esc(relDay(e.date))}</p>`,
    values: { next: { sales: j && (j.quotes || []).length ? 'again' : 'quotes', measure: 'order', install: 'done' }[e.type] || '', remind: e.type === 'sales' ? '2' : '' },
    fields: [
      { name: 'summary', label: 'What happened?', type: 'textarea', rows: 4, placeholder: e.type === 'sales' ? 'What they want, rooms, rough sizes, budget…' : 'Anything worth remembering' },
      ...(j && NEXT_OPTS.length ? [{ name: 'next', label: 'What’s next?', type: 'radios', options: NEXT_OPTS }] : []),
      { name: 'remind', label: 'Remind me to follow up', type: 'radios', options: [['', 'No'], ['2', 'In 2 days'], ['7', 'In a week'], ['14', 'In 2 weeks']] },
    ],
  });
  if (!d) return;
  put('events', { ...e, done: true, summary: d.summary });
  if (j) {
    if (d.summary) { j.log = j.log || []; j.log.push({ id: uid(), date: e.date, type: e.type === 'sales' ? 'Visit' : 'Note', text: `${evType(e.type).label}: ${d.summary}` }); }
    put('jobs', j);
    const c = client(j);
    if (d.remind) put('tasks', { title: d.next === 'quotes' ? `Send quotes to ${firstName(c && c.name) || 'client'}` : `Follow up with ${firstName(c && c.name) || 'client'}`, due: addDays(today(), Number(d.remind)), jobId: j.id, done: false, forStage: d.next === 'quotes' && j.stage === 'lead' ? 'consult' : j.stage });
    if (d.next === 'quotes' && j.stage === 'lead') setStage(j, 'consult');
    if (d.next === 'lost') setStage(j, 'lost');
    if (d.next === 'done') setStage(j, 'complete');
    if (d.next === 'again') return eventForm({}, { jobId: j.id, type: e.type, date: addDays(today(), 7) });
    if (d.next === 'yes') { setStage(j, 'measure'); return eventForm({}, { jobId: j.id, type: 'measure', date: addDays(today(), 3) }); }
    if (d.next === 'order') return orderedFlow(get('jobs', j.id));
  } else if (d.remind) put('tasks', { title: `Follow up: ${e.title || evType(e.type).label}`, due: addDays(today(), Number(d.remind)), jobId: '', done: false });
  toast('Saved');
}

// A finished reminder's notes are copied into its job's Notes so they're easy to find later.
function noteFromTask(t) {
  const j = t.jobId && get('jobs', t.jobId);
  if (!j) return;
  j.log = j.log || [];
  const entry = j.log.find((l) => l.taskId === t.id);
  if (t.notes) {
    const fields = { date: (t.doneAt || '').slice(0, 10) || t.due || today(), type: 'Note', text: `${t.title}: ${t.notes}` };
    if (entry) Object.assign(entry, fields); else j.log.push({ id: uid(), taskId: t.id, ...fields });
  } else if (entry) j.log = j.log.filter((l) => l !== entry);
  else return;
  put('jobs', j);
}
function tick(id) {
  const t = get('tasks', id);
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? nowISO() : '';
  put('tasks', t);
  if (t.done) { noteFromTask(t); toast('Done'); }
}

// Keep a new file on this device right away; it uploads on the next sync.
async function uploadFile(file, label, note) {
  if (file.size > 45 * 1024 * 1024) { toast('That file is over 45 MB. Try a smaller copy.'); return null; }
  const id = uid();
  try { await idb.set('blobs', id, file); } catch (e) { toast('Couldn’t keep that file on this device. It may be out of space.'); return null; }
  syncSoon();
  return { id, name: file.name || 'file', label, type: file.type || '', size: file.size, addedAt: nowISO(), note: note || '', pending: true };
}

  if (!d) return;
  if (!d.file) { toast('Choose a file first'); return addFile(j); }
  const rec = await uploadFile(d.file, d.label || 'Other', d.note);
  if (!rec) return;
  const fresh = get('jobs', j.id);
  fresh.files = fresh.files || [];
  fresh.files.push(rec);
  if (rec.label === 'Quote') { fresh.quotes = fresh.quotes || []; fresh.quotes.push({ id: uid(), name: rec.name.replace(/\.[^.]+$/, ''), amount: '', note: rec.note, fileId: rec.id, date: today(), chosen: false }); }
  put('jobs', fresh);
  toast('File added');
}
async function fileMenu(j, fid) {
  const f = (j.files || []).find((x) => x.id === fid);
  if (!f) return;
  const a = await choose(f.name, [{ value: 'rename', label: 'Rename or change kind' }, { value: 'delete', label: 'Delete file', cls: 'danger' }]);
  if (a === 'rename') {
    const d = await form({ title: 'File', values: f, fields: [{ name: 'name', label: 'Name', required: true }, { name: 'label', label: 'Kind', type: 'radios', options: FILE_LABELS }, { name: 'note', label: 'Note' }] });
    if (!d) return;
    Object.assign(f, d);
    put('jobs', j);
  } else if (a === 'delete') {
    if (!(await ask('Delete file?', esc(f.name) + ' will be removed for good.', 'Delete', true))) return;
    j.files = j.files.filter((x) => x.id !== fid);
    (j.quotes || []).forEach((q) => { if (q.fileId === fid) q.fileId = ''; });
    put('jobs', j);
    idb.del('blobs', f.id).catch(() => {});
    if (f.path && S.sb && navigator.onLine) S.sb.storage.from('files').remove([f.path]).catch(() => {});
    toast('Deleted');
  }
}

async function orderedFlow(j) {
  const d = await form({
    title: 'Order placed', intro: `<p class="sheet-context">${esc(j.name)}</p>`,
    values: { eta: addDays(today(), 28) },
    fields: [{ name: 'eta', label: 'When should the product arrive?', type: 'date', hint: 'You’ll get a reminder that day to book the install.' }],
    submit: 'Mark as ordered',
  });
  if (!d) return;
  j.eta = d.eta;
  (j.items || []).forEach((i) => { if (!i.status || i.status === 'Quoted') i.status = 'Ordered'; });
  setStage(j, 'ordered');
  if (d.eta) put('tasks', { title: 'Product should be in: book the install', due: d.eta, jobId: j.id, done: false, auto: 'eta', forStage: 'ordered' });
  toast('Marked as ordered');
}

async function nextAction(act) {
  const j = curJob();
  if (!j) return;
  if (act === 'book-sales') return eventForm({}, { jobId: j.id, type: 'sales', date: addDays(today(), 1) });
  if (act === 'book-measure') return eventForm({}, { jobId: j.id, type: 'measure', date: addDays(today(), 3) });
  if (act === 'book-install') return eventForm({}, { jobId: j.id, type: 'install', date: addDays(today(), 3) });
  if (act === 'add-quote') return quoteForm(j);
  if (act === 'ordered') return orderedFlow(j);
  if (act === 'said-yes') {
    const qs = j.quotes || [];
    let pick = qs.length === 1 ? qs[0].id : '';
    if (qs.length > 1) {
      pick = await choose('Which option did they pick?', qs.map((q) => ({ value: q.id, label: q.name, hint: money(q.amount) })));
      if (!pick) return;
    }
    qs.forEach((q) => { q.chosen = q.id === pick; });
    setStage(j, 'measure');
    toast('On to final measure');
    return eventForm({}, { jobId: j.id, type: 'measure', date: addDays(today(), 3) });
  }
  if (act === 'mark-lost') { if (await ask('Mark as lost?', 'The job moves to the Lost list. You can reopen it any time.', 'Mark lost')) { setStage(j, 'lost'); toast('Moved to Lost'); } return; }
  if (act === 'finish') {
    if (!(await ask('Job finished?', 'You’ll get a reminder in 2 weeks to check in with the client.', 'Finish job'))) return;
    (j.items || []).forEach((i) => { if (i.status !== 'Issue') i.status = 'Installed'; });
    setStage(j, 'complete');
    toast('Nice work. Job done.');
    return;
  }
  if (act === 'reopen') {
    const prev = (j.stageHistory || []).map((h) => h.stage).filter((s) => STEP_IDS.includes(s)).pop() || 'lead';
    setStage(j, prev);
    toast('Reopened');
  }
}

async function changeStage(j) {
  const n = stageIdx(j.stage);
  const to = await choose('Move to which step?', [...STAGES.slice(0, 7).map((s, i) => ({ value: s.id, label: s.label, hint: s.id === j.stage ? 'Current step' : i < n ? 'Go back' : '', cls: s.id === j.stage ? 'primary' : '' })), { value: 'lost', label: 'Lost', hint: 'They didn’t go ahead' }]);
  if (to && to !== j.stage) { setStage(j, to); toast('Moved to ' + stage(to).label); }
}

async function jobMenu(j) {
  const a = await choose(j.name, [
    { value: 'edit', label: 'Edit details' },
    { value: 'stage', label: 'Change step' },
    ...(j.stage !== 'lost' ? [{ value: 'lost', label: 'Mark as lost' }] : []),
    { value: 'delete', label: 'Delete job', cls: 'danger' },
  ]);
  if (a === 'edit') return editJob(j);
  if (a === 'stage') return changeStage(j);
  if (a === 'lost') { setStage(j, 'lost'); toast('Moved to Lost'); }
  if (a === 'delete') {
    if (!(await ask('Delete this job?', `${esc(j.name)} and its appointments, reminders, notes and files will be removed for good.`, 'Delete job', true))) return;
    jobEvents(j.id).forEach((e) => del('events', e.id));
    jobTasks(j.id).forEach((t) => del('tasks', t.id));
    del('jobs', j.id);
    go('jobs');
    toast('Job deleted');
  }
}

// ---------- Backup and import ----------
async function exportBackup() {
  const data = { app: 'job-tracker-2', exportedAt: nowISO(), jobs: all('jobs'), events: all('events'), tasks: all('tasks'), contacts: S.meta.contacts || [] };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const name = `job-tracker-backup-${today()}.json`;
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Job Tracker backup' }); }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
    S.meta.lastBackup = nowISO();
    enqueue('meta', 'info', { lastBackup: S.meta.lastBackup });
    toast('Backup saved');
  } catch (e) { if (e && e.name !== 'AbortError') toast('Backup wasn’t saved.'); }
}

function dataURLToBlob(url) {
  const [head, b64] = url.split(',');
  const type = (head.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}

async function importFile(file) {
  const box = $('#import-progress'), bar = $('#import-progress i'), msg = $('#import-msg');
  const show = (p, m) => { if (box) { box.hidden = false; bar.style.width = Math.round(p * 100) + '%'; msg.textContent = m; } };
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t a backup file.'); return; }
  let jobs = [], events = [], tasks = [], contacts = [], fileData = {};
  if (!S.user) { toast('Sign in first.'); return; }
  if (d && d.app === 'job-tracker-2') {
    ({ jobs = [], events = [], tasks = [], contacts = [] } = d);
  } else if (d && Array.isArray(d.projects) && Array.isArray(d.contacts)) {
    fileData = d.fileData || {};
    const cById = new Map(d.contacts.map((c) => [c.id, c]));
    const coById = new Map((d.companies || []).map((c) => [c.id, c]));
    const used = new Set();
    jobs = d.projects.map((p) => {
      const stageId = OLD_STAGES[p.stage] || p.stage || 'lead';
      const people = (p.contacts || []).map((pc) => { const c = cById.get(pc.contactId); if (!c) return null; used.add(c.id); return { name: c.name, role: pc.role || c.role || '', company: c.company || (coById.get(c.companyId) || {}).name || '', phone: c.phone || '', email: c.email || '', notes: c.notes || '' }; }).filter(Boolean);
      const log = (p.log || []).map((l) => ({ id: l.id || uid(), date: l.date || '', type: l.type || 'Note', text: l.summary || '', who: (cById.get(l.contactId) || {}).name || '', ...(l.taskId ? { taskId: l.taskId } : {}) }));
      if ((p.phases || []).length) log.push({ id: 'phases-' + p.id, date: (p.createdAt || nowISO()).slice(0, 10), type: 'Note', text: 'Job phases (from the old app):\n' + p.phases.map((ph) => `• ${ph.name}: ${ph.status}${ph.date ? ' (' + ph.date + ')' : ''}${ph.waitingOn ? ', waiting on ' + ph.waitingOn : ''}${ph.notes ? ', ' + ph.notes : ''}`).join('\n') });
      return {
        id: p.id, name: p.name || 'Untitled job', stage: stageId, address: p.address || '', source: p.source || '', referredBy: p.referredBy || '', value: p.estValue ?? '', eta: p.eta || '', about: p.notes || '',
        people, log, quotes: (p.quotes || []).map((q) => ({ ...q })), items: (p.items || []).map((i) => ({ ...i })),
        files: (p.files || []).map((f) => ({ id: f.id, name: f.name, label: f.label || 'Other', type: f.type || '', size: f.size || 0, addedAt: f.addedAt || '', note: f.note || '' })),
        stageHistory: (p.stageHistory || []).map((h) => ({ stage: OLD_STAGES[h.stage] || h.stage, at: h.at })), createdAt: p.createdAt || nowISO(), updatedAt: p.updatedAt || nowISO(),
      };
    });
    events = (d.events || []).map((e) => ({ id: e.id, title: e.title || '', type: e.type || 'other', jobId: e.projectId || '', date: e.date, start: e.start || '', end: e.end || '', days: e.days || 1, location: e.location || '', notes: e.notes || '', done: !!e.done, createdAt: e.createdAt || nowISO() })).filter((e) => e.date);
    tasks = (d.tasks || []).map((t) => ({ id: t.id, title: t.title || 'Reminder', due: t.due || today(), time: t.time || '', jobId: t.projectId || '', done: !!t.done, doneAt: t.doneAt || '', notes: t.notes || '', forStage: t.forStage || '', auto: t.auto || false, createdAt: t.createdAt || nowISO() }));
    contacts = d.contacts.map((c) => ({ name: c.name || '', role: c.role || '', company: c.company || (coById.get(c.companyId) || {}).name || '', phone: c.phone || '', email: c.email || '', notes: c.notes || '' })).filter((c) => c.name);
    (d.companies || []).forEach((co) => { if (co.phone || co.email || co.notes) contacts.push({ name: co.name, role: co.type || 'Company', company: '', phone: co.phone || '', email: co.email || '', notes: [co.address, co.website, co.notes].filter(Boolean).join(' · ') }); });
  } else { toast('That file isn’t a Job Tracker backup.'); return; }

  const fileJobs = jobs.flatMap((j) => (j.files || []).filter((f) => fileData[f.id]).map((f) => [j, f]));
  const ok = await ask('Bring this in?', `${jobs.length} jobs, ${events.length} appointments, ${tasks.length} reminders${fileJobs.length ? `, ${fileJobs.length} files` : ''}. Jobs already here with the same ID will be replaced by the copy in the file.`, 'Bring it in');
  if (!ok) return;
  const total = fileJobs.length + 1;
  let doneN = 0;
  let failed = 0;
  for (const [, f] of fileJobs) {
    try { await idb.set('blobs', f.id, dataURLToBlob(fileData[f.id])); f.pending = true; delete f.missing; }
    catch (e) { f.missing = true; failed++; }
    doneN++; show(doneN / total, `Keeping files on this device… ${f.name}`);
  }
  jobs.forEach((j) => (j.files || []).forEach((f) => { if (!f.pending && !f.path && !f.assetId) f.missing = true; if (f.assetId && !f.path) f.missing = true; }));
  jobs.forEach((j) => put('jobs', j));
  events.forEach((e) => put('events', e));
  tasks.forEach((t) => put('tasks', t));
  if (contacts.length) { S.meta.contacts = contacts; enqueue('meta', 'contacts', { list: contacts }); }
  await persistNow();
  show(1, `Brought in ${jobs.length} jobs, ${events.length} appointments and ${tasks.length} reminders.${failed ? ` ${failed} files couldn’t be read.` : ''} ${navigator.onLine ? 'Syncing now.' : 'They’ll sync when you’re back online.'}`);
  toast('Data brought in');
  syncSoon(50);
}

async function eraseAll() {
  if (!(await ask('Erase all jobs?', 'Every job, appointment and reminder will be deleted from your account. Save a backup first if you might want them back.', 'Erase everything', true))) return;
  all('events').forEach((e) => del('events', e.id));
  all('tasks').forEach((t) => del('tasks', t.id));
  all('jobs').forEach((j) => del('jobs', j.id));
  toast('Erased');
}

// ---------- Events ----------
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  const j = curJob();
  if (act === 'tick') { ev.stopPropagation(); return tick(id); }
  if (el.tagName === 'A' && act !== 'copy') return;
  ev.preventDefault();
  switch (act) {
    case 'copy': return copyText(el.dataset.v);
    case 'pick-day': V.sel = el.dataset.day; return render();
    case 'week': V.weekStart = addDays(V.weekStart, Number(el.dataset.n)); V.sel = V.weekStart <= today() && today() <= addDays(V.weekStart, 13) ? today() : V.weekStart; return render();
    case 'go-today': V.sel = today(); V.weekStart = ''; return render();
    case 'filter': V.filter = el.dataset.f; V.q = ''; return render();
    case 'new-job': return newJob();
    case 'new-event': return eventForm({}, j ? { jobId: j.id, type: { lead: 'sales', consult: 'sales', quoted: 'sales', measure: 'measure', ordered: 'install', install: 'install' }[j.stage] || 'other', date: addDays(today(), 1) } : { date: V.route === 'today' ? V.sel : today() });
    case 'new-task': return taskForm({}, j ? { jobId: j.id, due: addDays(today(), 1) } : { due: V.route === 'today' ? V.sel : today() });
    case 'event': { const e = get('events', id); return e && eventForm(e); }
    case 'how': { const e = get('events', id); return e && howItWent(e); }
    case 'task': { const t = get('tasks', id); return t && taskForm(t); }
    case 'export': return exportBackup();
    case 'sync-now': S.syncError = ''; toast(navigator.onLine ? 'Syncing…' : 'You’re offline. It will sync when you’re back online.'); return sync();
    case 'signout': return signOut();
    case 'cal-make': return makeCalendarLink(false);
    case 'cal-new': return makeCalendarLink(true);
    case 'cal-retry': S.cal = null; return render();
    case 'signup': return signUp();
    case 'erase': return eraseAll();
  }
  if (!j) return;
  switch (act) {
    case 'add-coming': return choose('Add to this job', [{ value: 'new-event', label: 'Appointment', hint: 'Sales call, measure, install, site visit' }, { value: 'new-task', label: 'Reminder', hint: 'Something to do on a date' }]).then((a) => { if (a) { const b = document.createElement('button'); b.dataset.act = a; b.hidden = true; document.body.appendChild(b); b.click(); b.remove(); } });
    case 'job-menu': return jobMenu(j);
    case 'change-stage': return changeStage(j);
    case 'edit-job': return editJob(j);
    case 'add-note': return noteForm(j);
    case 'edit-note': return noteForm(j, (j.log || []).find((l) => l.id === id));
    case 'edit-quote': return quoteForm(j, (j.quotes || []).find((q) => q.id === id));
    case 'add-item': return itemForm(j);
    case 'edit-item': return itemForm(j, (j.items || []).find((i) => i.id === id));
    case 'add-person': return personForm(j);
    case 'edit-person': return personForm(j, Number(el.dataset.i));
    case 'add-file': return addFile(j);
    case 'file-menu': return fileMenu(j, id);
    default: return nextAction(act);
  }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[role=button]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { V.q = e.target.value; render(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'import-file' && e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ''; }
});
window.addEventListener('hashchange', () => { parseHash(); render(); });

// ---------- Start ----------
function storedUser() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (/^sb-.*-auth-token$/.test(k)) { const v = JSON.parse(localStorage.getItem(k)); return v && (v.user || (v.currentSession && v.currentSession.user)); }
    }
  } catch (e) {}
  return null;
}
function config() {
  if (BAKED.url && BAKED.key) return BAKED;
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { return null; }
}
async function openUser(user) {
  S.user = user;
  S.mode = 'live';
  S.msg = '';
  const st = await idb.get('kv', 'state:' + user.id).catch(() => null);
  if (st) {
    S.jobs = new Map((st.jobs || []).map((x) => [x.id, x]));
    S.events = new Map((st.events || []).map((x) => [x.id, x]));
    S.tasks = new Map((st.tasks || []).map((x) => [x.id, x]));
    S.meta = st.meta || { contacts: [] };
    outbox = st.outbox || {};
    lastPull = st.lastPull || '';
    S.loaded = !!lastPull || S.jobs.size > 0;
  }
  if (V.route === 'setup') go('today');
  render();
  try {
    S.sb.channel('docs-' + user.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'user_id=eq.' + user.id }, (p) => { if (p.new) { applyRemote(p.new); persist(); } })
      .subscribe();
  } catch (e) { console.error(e); }
  syncSoon(0);
}
async function start() {
  parseHash();
  const cfg = config();
  if (!cfg || !cfg.url) { S.mode = 'setup'; return render(); }
  if (!window.supabase) { S.mode = 'signin'; S.msg = 'The app couldn’t finish loading. Connect to the internet and reopen it once.'; return render(); }
  S.sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  render();
  let session = null;
  try { const { data } = await S.sb.auth.getSession(); session = data && data.session; } catch (e) { console.error(e); }
  if (session) return openUser(session.user);
  const u = storedUser();
  if (u && !navigator.onLine) return openUser(u); // offline: keep working with what's on this device
  S.mode = 'signin';
  render();
}

document.addEventListener('submit', async (e) => {
  if (e.target.id === 'setup-form') {
    e.preventDefault();
    const url = $('#cfg-url').value.trim().replace(/\/+$/, '');
    const key = $('#cfg-key').value.trim().replace(/\s+/g, '');
    if (!/^https:\/\/.+/.test(url) || key.length < 20) { toast('Paste both values from Supabase.'); return; }
    try { localStorage.setItem(CFG_KEY, JSON.stringify({ url, key })); } catch (err) {}
    return start();
  }
  if (e.target.id === 'signin-form') {
    e.preventDefault();
    const email = $('#si-email').value.trim(), password = $('#si-pass').value;
    if (!email || !password) { toast('Enter your email and password.'); return; }
    const { data, error } = await S.sb.auth.signInWithPassword({ email, password });
    if (error) { toast(/confirm/i.test(error.message) ? 'Tap the link in the email from Supabase first, then sign in.' : 'That email and password didn’t work.'); return; }
    openUser(data.user);
  }
});
async function signUp() {
  const email = $('#si-email').value.trim(), password = $('#si-pass').value;
  if (!email || password.length < 6) { toast('Enter your email and a password of at least 6 characters.'); return; }
  const { data, error } = await S.sb.auth.signUp({ email, password });
  if (error) { toast(error.message); return; }
  if (data.session) return openUser(data.user);
  S.msg = 'Account created. Check your email, tap the confirm link, then come back here and sign in.';
  render();
}
async function signOut() {
  if (Object.keys(outbox).length && !(await ask('Sign out?', 'Some changes haven’t synced yet. They stay on this device and sync next time you sign in here.', 'Sign out'))) return;
  await persistNow();
  try { await S.sb.auth.signOut(); } catch (e) {}
  S.user = null; S.jobs = new Map(); S.events = new Map(); S.tasks = new Map(); S.meta = { contacts: [] }; outbox = {}; lastPull = ''; S.loaded = false;
  S.mode = 'signin';
  render();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
start();
})();
