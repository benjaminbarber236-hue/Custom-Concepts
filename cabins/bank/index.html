<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Land Loan Questions</title>
<meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loan Qs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Same look as Cabins: warm timber and forest tones. One column; one card per question. */
:root {
  --bg: #f4f0e8; --surface: #fffcf7; --surface-2: #ebe5da; --ink: #23201b; --muted: #6f695f; --line: #e2dacd;
  --accent: #3f6247; --accent-ink: #fff; --accent-soft: #dfe8dc; --wood: #9a6431;
  --font: 'Figtree', system-ui, -apple-system, sans-serif; --display: 'Fraunces', Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #161512; --surface: #1f1d19; --surface-2: #2a2722; --ink: #eeeae2; --muted: #a39d92; --line: #34302a;
  --accent: #8fbf96; --accent-ink: #10190f; --accent-soft: #24311f; --wood: #d9a066; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
main { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) max(16px, env(safe-area-inset-left, 0px)); }
h1 { font: 600 30px/1.15 var(--display); margin: 0; letter-spacing: -.01em; }
.eyebrow { color: var(--accent); font-weight: 600; font-size: 14px; margin: 0 0 2px; }
.muted { color: var(--muted); } .small { font-size: 13.5px; }
p { margin: 0; }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; }
.tabs button { flex: 1; border: 0; background: none; padding: 9px 4px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=tel], textarea { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); outline: none; font-size: 16px; }
input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 44px; line-height: 1.4; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
h2 { font-size: 15px; margin: 8px 2px 0; display: flex; justify-content: space-between; align-items: baseline; }
h2 span { font-size: 13px; color: var(--muted); font-weight: 500; }
.card.q { flex-direction: row; gap: 12px; align-items: flex-start; }
.q input[type=checkbox] { appearance: none; -webkit-appearance: none; flex: none; width: 26px; height: 26px; margin: 0; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; cursor: pointer; }
.q input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
.q input[type=checkbox]:checked::after { content: ''; width: 6px; height: 12px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: translateY(-1px) rotate(45deg); }
.q input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.q-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.q-text { font-weight: 600; line-height: 1.35; }
.q-tip { font-size: 13px; color: var(--muted); margin-top: -4px; }
.q.done .q-text { color: var(--muted); }
.key { border-left: 4px solid var(--wood); }
.key-tag { font-size: 11.5px; font-weight: 700; color: var(--wood); letter-spacing: .04em; text-transform: uppercase; }
.compare { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.btn { border: 0; background: var(--surface-2); padding: 10px 16px; border-radius: 999px; font-weight: 600; cursor: pointer; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.saved { font-size: 12.5px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Cabins · Goals &amp; money</p>
    <h1>Land Loan Questions</h1>
    <p class="muted small" style="margin-top:6px">Ask each bank the same questions. Tick each one off and type the answer under it. Everything saves on this phone.</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Banks"></nav>
  <section class="card" id="bankCard"></section>
  <div id="questions"></div>
  <h2>Compare banks</h2>
  <section class="card compare" id="compare"></section>
  <div class="row" style="justify-content:center"><button class="btn" id="copy" type="button">Copy all answers</button><button class="btn" id="clear" type="button">Clear this bank</button></div>
  <p class="saved" id="saved"></p>
</main>
<script>
(function () {
  const GROUPS = [
    ['Do they do this kind of loan?', [
      ['Do you make loans on raw land with no house on it?'],
      ['Do you lend in the county where I\'m looking?'],
      ['Is it different if the land has no road, power or water yet?'],
    ]],
    ['Money up front', [
      ['How much down payment do you need?', 'Raw land often needs 20–50%.', 'down'],
      ['What closing costs and fees should I expect?', '', 'fees'],
      ['Do you need a survey, appraisal or perc test before approving, and who pays?'],
    ]],
    ['The loan itself', [
      ['What interest rate are you offering right now? Fixed or does it change?', '', 'rate'],
      ['How many years is the loan? Is there a balloon payment at the end?', '', 'term'],
      ['What would my monthly payment be on a loan of $____?', '', 'payment'],
      ['Is there a penalty for paying it off early?'],
    ]],
    ['Qualifying', [
      ['What credit score do you look for?'],
      ['How much income and debt do you allow?'],
      ['Can I get pre-approved, and how long does it take?'],
    ]],
    ['Building the cabins later', [
      ['Do you also do construction loans for building on the land later?', '', 'constr', true],
      ['Can the land loan roll into a construction loan, or would I refinance?', '', '', true],
      ['Can the land I own count as the down payment on the construction loan?', '', '', true],
      ['Do you lend to owner-builders who do the work themselves?', '', '', true],
      ['Do you lend on cabins meant as short-term rentals?', '', '', true],
    ]],
    ['Rules on the land', [
      ['Are there acreage limits or land you won\'t lend on (flood zone, no legal road access)?'],
      ['Is there a deadline to start building?'],
    ]],
    ['Before you hang up', [
      ['Get the loan officer\'s name, direct phone and email (fill in at the top).'],
      ['Ask them to email the list of documents they need.'],
    ]],
  ];
  const Q = []; GROUPS.forEach(([g, qs]) => qs.forEach(([t, tip, key, important]) => Q.push({ g, t, tip: tip || '', key: key || '', important: !!important })));
  const COMPARE = [['down', 'Down payment'], ['rate', 'Rate'], ['term', 'Years / balloon'], ['payment', 'Monthly'], ['fees', 'Fees'], ['constr', 'Construction loan?']];
  const KEY = 'land-loan-questions-v1';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const blankBank = () => ({ name: '', person: '', phone: '', email: '', when: '', checks: {}, answers: {} });
  let st;
  try { st = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { st = null; }
  if (!st || !Array.isArray(st.banks)) st = { cur: 0, banks: [blankBank(), blankBank(), blankBank()] };
  let timer;
  function save() {
    clearTimeout(timer);
    timer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(st)); document.getElementById('saved').textContent = 'Saved on this phone'; } catch (e) { document.getElementById('saved').textContent = 'Could not save. Use Copy all answers to keep a copy.'; } }, 250);
  }
  const bankName = (b, i) => b.name.trim() || 'Bank ' + (i + 1);

  function renderTabs() {
    document.getElementById('tabs').innerHTML = st.banks.map((b, i) => `<button type="button" data-i="${i}" class="${i === st.cur ? 'on' : ''}" aria-pressed="${i === st.cur}">${esc(bankName(b, i))}</button>`).join('');
  }
  function renderBank() {
    const b = st.banks[st.cur];
    document.getElementById('bankCard').innerHTML = `
      <label class="f">Bank or lender<input type="text" id="b-name" data-f="name" value="${esc(b.name)}" placeholder="e.g. First Valley Bank"></label>
      <div class="two"><label class="f">Loan officer<input type="text" id="b-person" data-f="person" value="${esc(b.person)}"></label>
      <label class="f">Phone<input type="tel" id="b-phone" data-f="phone" value="${esc(b.phone)}"></label></div>
      <div class="two"><label class="f">Email<input type="text" id="b-email" data-f="email" inputmode="email" value="${esc(b.email)}"></label>
      <label class="f">Date called<input type="text" id="b-when" data-f="when" value="${esc(b.when)}" placeholder="Nov 18"></label></div>`;
    let last = '';
    document.getElementById('questions').innerHTML = Q.map((q, i) => {
      const head = q.g !== last ? `<h2>${esc(q.g)}<span>${Q.filter((x) => x.g === q.g).filter((x) => b.checks[Q.indexOf(x)]).length}/${Q.filter((x) => x.g === q.g).length}</span></h2>` : '';
      last = q.g;
      return `${head}<div class="card q ${q.important ? 'key' : ''} ${b.checks[i] ? 'done' : ''}" style="margin-top:8px">
        <input type="checkbox" id="c${i}" data-c="${i}" ${b.checks[i] ? 'checked' : ''} aria-label="Asked">
        <div class="q-body">${q.important ? '<span class="key-tag">Key for your cabins</span>' : ''}
          <label for="c${i}" class="q-text">${esc(q.t)}</label>${q.tip ? `<p class="q-tip">${esc(q.tip)}</p>` : ''}
          <textarea id="a${i}" data-a="${i}" rows="1" placeholder="Their answer">${esc(b.answers[i] || '')}</textarea></div></div>`;
    }).join('');
    document.querySelectorAll('textarea').forEach(grow);
  }
  function renderCompare() {
    const cols = st.banks.map(bankName);
    const ans = (b, k) => { const i = Q.findIndex((q) => q.key === k); return esc(b.answers[i] || '–'); };
    document.getElementById('compare').innerHTML = `<table><thead><tr><th></th>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${COMPARE.map(([k, l]) => `<tr><th>${l}</th>${st.banks.map((b) => `<td>${ans(b, k)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  function grow(t) { t.style.height = 'auto'; t.style.height = Math.max(44, t.scrollHeight + 2) + 'px'; }
  function all() { renderTabs(); renderBank(); renderCompare(); }

  document.getElementById('tabs').addEventListener('click', (e) => { const btn = e.target.closest('button'); if (!btn) return; st.cur = Number(btn.dataset.i); save(); all(); window.scrollTo(0, 0); });
  document.addEventListener('input', (e) => {
    const t = e.target, b = st.banks[st.cur];
    if (t.dataset.f) { b[t.dataset.f] = t.value; if (t.dataset.f === 'name') renderTabs(); renderCompare(); }
    else if (t.dataset.a) { b.answers[t.dataset.a] = t.value; grow(t); renderCompare(); }
    save();
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (!t.dataset.c) return;
    const b = st.banks[st.cur];
    if (t.checked) b.checks[t.dataset.c] = 1; else delete b.checks[t.dataset.c];
    t.closest('.q').classList.toggle('done', t.checked);
    save();
    const y = window.scrollY; renderBank(); window.scrollTo(0, y);
  });
  document.getElementById('copy').addEventListener('click', async () => {
    const text = st.banks.map((b, bi) => {
      const lines = [`== ${bankName(b, bi)} ==`, [b.person, b.phone, b.email, b.when].filter(Boolean).join(' · ')];
      Q.forEach((q, i) => { if (b.answers[i]) lines.push(`- ${q.t}\n  ${b.answers[i]}`); });
      return lines.filter(Boolean).join('\n');
    }).join('\n\n');
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { /* fall through */ }
    document.getElementById('saved').textContent = ok ? 'Copied. Paste it into Notes or a step in Cabins.' : 'Could not copy on this browser.';
  });
  let armed = false;
  document.getElementById('clear').addEventListener('click', (e) => {
    if (!armed) { armed = true; e.target.textContent = 'Tap again to clear'; setTimeout(() => { armed = false; e.target.textContent = 'Clear this bank'; }, 3000); return; }
    armed = false; e.target.textContent = 'Clear this bank';
    st.banks[st.cur] = blankBank(); save(); all();
  });
  all();
})();
</script>
</body>
</html>
