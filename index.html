<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Job Tracker</title>
  <meta name="description" content="Sales and install tracker for a window covering business: leads, consults, proposals, products, install phases, and follow-ups.">
  <meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Job Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/home" class="brand"><img src="icons/icon.svg" alt="" width="24" height="24"> Job Tracker</a>
    <a href="#/settings" class="icon-btn" aria-label="Settings"><span data-icon="sliders"></span></a>
  </header>

  <main id="main" class="container"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/home" data-tab="home"><span data-icon="home"></span>Dashboard</a>
    <a href="#/sales" data-tab="sales"><span data-icon="briefcase"></span>Sales</a>
    <a href="#/installs" data-tab="installs"><span data-icon="wrench"></span>Installs</a>
    <a href="#/contacts" data-tab="contacts"><span data-icon="users"></span>Contacts</a>
  </nav>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/files.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
